# REFRACT CI
#
#  ⚡ logic-tests  : GitHub 클라우드(ubuntu)에서 dotnet으로 Core 로직 테스트 — Unity 불필요, 약 20초
#  🎮 unity-tests  : 내 PC(self-hosted 러너)의 Unity로 EditMode 테스트 — 이미 활성화된 라이선스 사용
#  📦 build-webgl  : 내 PC(self-hosted 러너)의 Unity로 WebGL 빌드 → artifact 업로드 (main push / 수동 실행)
#
# 클라우드 러너에서 Unity 계정 로그인(라이선스 활성화)이 실패해서, Unity가 필요한 작업은
# 라이선스가 이미 활성화된 내 PC를 러너로 등록해 실행한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: read

jobs:
  # ───────────── ⚡ Fast lane: 클라우드, Unity 없이 로직 테스트 ─────────────
  logic-tests:
    name: Logic Tests (dotnet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: >
          dotnet test Tests.Dotnet/Refract.Tests.Dotnet.csproj
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=logic-tests.trx"
          --results-directory test-results

      # 테스트 결과 요약을 Actions 실행 화면(Summary)에 표시
      - name: Write summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          lines = ['## ⚡ Logic Tests (dotnet)', '']
          for path in glob.glob('test-results/*.trx'):
              root = ET.parse(path).getroot()
              c = root.find('.//t:Counters', ns).attrib
              lines.append(f"**Total {c['total']} · Passed {c['passed']} · Failed {c['failed']}**")
              lines.append('')
              lines.append('| Result | Test |')
              lines.append('|---|---|')
              for r in root.findall('.//t:UnitTestResult', ns):
                  icon = '✅' if r.get('outcome') == 'Passed' else '❌'
                  lines.append(f"| {icon} | {r.get('testName')} |")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logic-test-results
          path: test-results

  # ───────────── 🎮 Unity lane: 내 PC(self-hosted)에서 Unity 테스트 ─────────────
  unity-tests:
    name: Unity EditMode Tests (self-hosted)
    # 보안: 공개 저장소라서 외부 PR 코드가 내 PC에서 실행되지 않도록 PR에서는 돌리지 않는다
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          clean: false    # Library 폴더를 지우지 않고 유지 → 두 번째 실행부터 빨라진다

      - name: Run EditMode tests
        # cmd에서 실행 정책(ExecutionPolicy)을 우회해 PowerShell 스크립트를 호출
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\run-unity.ps1 -Mode Tests

      - name: Upload test results and log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unity-test-results
          path: ci-output
          if-no-files-found: ignore

  # ───────────── 📦 Build: 테스트가 모두 통과하면 WebGL 빌드 ─────────────
  build-webgl:
    name: WebGL Build (self-hosted)
    needs: [logic-tests, unity-tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          clean: false

      - name: Build WebGL
        shell: cmd
        env:
          BUILD_OUTPUT: Builds/WebGL
          BUILD_VERSION: 0.2.${{ github.run_number }}   # 화면 오른쪽 아래에 v0.2.<실행번호> 로 표시
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\run-unity.ps1 -Mode BuildWebGL

      - name: Upload WebGL build
        uses: actions/upload-artifact@v6
        with:
          name: REFRACT-WebGL
          path: Builds/WebGL

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unity-build-log
          path: ci-output
          if-no-files-found: ignore
